{% extends "base.html" %}
{% block content %}
<section class="login panel">
  <h1>Đổi mật khẩu</h1>
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <p class="notice {{ category }}" role="status">{{ message }}</p>
  {% endfor %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <label>Mật khẩu hiện tại <input type="password" name="current" autocomplete="current-password" maxlength="128" required></label>
    <label>Mật khẩu mới <input type="password" name="new" autocomplete="new-password" minlength="12" maxlength="128" required></label>
    <button>Lưu mật khẩu</button>
  </form>
</section>
{% endblock %}
