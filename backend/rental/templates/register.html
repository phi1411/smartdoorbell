{% extends "base.html" %}
{% block content %}
<section class="login panel">
  <h1>Đăng ký tài khoản</h1>
  <p class="muted">Nhập mã mời do chủ trọ cấp để liên kết tài khoản với phòng bạn đang thuê.</p>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    <input type="hidden" name="csrf" value="{{ session.csrf }}">
    <label>Mã mời <input name="code" value="{{ code|default('') }}" minlength="24" maxlength="24" autocapitalize="none" spellcheck="false" required></label>
    <label>Tên đăng nhập <input name="username" value="{{ username|default('') }}" pattern="[A-Za-z][A-Za-z0-9_.\-]{2,31}" maxlength="32" autocomplete="username" autocapitalize="none" aria-describedby="username-help" required>
      <small id="username-help">3–32 ký tự, bắt đầu bằng chữ cái. Dùng chữ không dấu, số, dấu chấm, gạch ngang hoặc gạch dưới.</small>
    </label>
    <label>Mật khẩu <input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
      <small>Từ 12 đến 128 ký tự.</small>
    </label>
    <label>Nhập lại mật khẩu <input name="confirmation" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
    <button>Đăng ký</button>
  </form>
  <p><a href="{{ url_for('login') }}">Quay lại đăng nhập</a></p>
</section>
{% endblock %}
